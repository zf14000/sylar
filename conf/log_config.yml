log:
  - name: 'root'
    level: 'DEBUG'
    formatter: '%d{%Y-%m-%d %H:%M:%S}%T%t%T%N%T%F%T[%p]%T[%c]%T%f:%l%T%m%n'
    appenders:
      - type: 'StdoutLogAppender'
        level: 'DEBUG'
  - name: 'system'
    level: 'DEBUG'
    appenders:
      - type: 'StdoutLogAppender'
      - type: 'FileLogAppender'
        level: 'INFO'
        file: '/home/zf/code/sylar/log/system.log'
        formatter: '%d{%Y-%m-%d %H:%M:%S}%T[%p]%T%f:%l%T%m%n'